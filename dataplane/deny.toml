# cargo-deny policy for the data plane (`make hygiene`, and CI): known vulnerabilities and
# unmaintained crates, licenses, duplicate versions, and where crates come from.

[graph]
all-features = true

[advisories]
# Every advisory fails the check unless it is listed here, with its reason.
ignore = [
    { id = "RUSTSEC-2026-0247", reason = "bitmaps is unmaintained; it comes only through libublk (the ublk binding), which has no replacement for it yet" },
]

[licenses]
# Licenses that allow distributing Flaminio under Apache-2.0. MPL-2.0 is copyleft per file only.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
]
confidence-threshold = 0.9

[licenses.private]
# The workspace's own crates are not published.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
