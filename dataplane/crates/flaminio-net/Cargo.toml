[package]
name = "flaminio-net"
version = "0.1.0"
description = "Flaminio replication transport: framed protocol over mutual TLS 1.3, peer identities, capability tokens"
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
bytes.workspace = true
flaminio-repl = { path = "../flaminio-repl" }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
futures-rustls = { version = "0.26", default-features = false, features = ["ring"] }
rustls-pki-types = { version = "1.15", features = ["std"] }
ring = "0.17.14"
x509-parser = "0.18.1"
futures-lite = "2"
thiserror.workspace = true

[features]
# token::decode_unverified: a token's claims without its signature, for the target's own replica
# (flaminio-node) and the fuzz target (docs/issues/30, S6). Cargo unifies features across the
# workspace, so this marks intent; it does not stop other crates from calling it.
unverified = []

[dev-dependencies]
smol.workspace = true
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }

[lints]
workspace = true
