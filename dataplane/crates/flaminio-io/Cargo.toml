[package]
name = "flaminio-io"
version = "0.1.0"
description = "Flaminio data-plane daemon: exposes volumes as /dev/ublkbN, backed by the replica store"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[[bin]]
name = "flaminio-io"
path = "src/main.rs"

[dependencies]
bytes.workspace = true
flaminio-format.workspace = true
flaminio-store.workspace = true
flaminio-uring.workspace = true
flaminio-node = { path = "../flaminio-node" }
flaminio-net = { path = "../flaminio-net" }
flaminio-metaclient = { path = "../flaminio-metaclient" }
flaminio-repl = { path = "../flaminio-repl" }

[target.'cfg(target_os = "linux")'.dependencies]
libublk.workspace = true
io-uring.workspace = true
smol.workspace = true
libc.workspace = true

[lints]
workspace = true
