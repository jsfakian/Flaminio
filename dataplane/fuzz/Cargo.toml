[package]
name = "flaminio-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4.10"
flaminio-format = { path = "../crates/flaminio-format" }
flaminio-net = { path = "../crates/flaminio-net" }

# Not part of the main workspace: build with `cargo +nightly fuzz run <target>`.
[workspace]
members = ["."]

# The regression test (`make fuzz-regressions`) runs optimized, as the fuzzer does, with the
# debug assertions and overflow checks of a dev build. cargo-fuzz builds in release.
[profile.dev]
opt-level = 3

[[bin]]
name = "superblock"
path = "fuzz_targets/superblock.rs"
test = false
doc = false
bench = false

[[bin]]
name = "metadata_pages"
path = "fuzz_targets/metadata_pages.rs"
test = false
doc = false
bench = false

[[bin]]
name = "journal"
path = "fuzz_targets/journal.rs"
test = false
doc = false
bench = false

[[bin]]
name = "repl_frame"
path = "fuzz_targets/repl_frame.rs"
test = false
doc = false
bench = false

[[bin]]
name = "capability_token"
path = "fuzz_targets/capability_token.rs"
test = false
doc = false
bench = false
