# cargo-deny policy for the fuzz crate's own workspace and lockfile (`make hygiene`). The same as
# ../deny.toml, which it must follow, plus the license of libFuzzer, which only this crate builds.

[graph]
all-features = true

[advisories]
# Every advisory fails the check unless it is listed here, with its reason.
ignore = []

[licenses]
# Licenses that allow distributing Flaminio under Apache-2.0. MPL-2.0 is copyleft per file only.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
]
confidence-threshold = 0.9

# libFuzzer, bundled by libfuzzer-sys: permissive, and only in the fuzz binaries, never shipped.
[[licenses.exceptions]]
crate = "libfuzzer-sys"
allow = ["NCSA"]

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
