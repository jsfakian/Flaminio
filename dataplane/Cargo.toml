[workspace]
resolver = "3"
members = ["crates/flaminio-format", "crates/flaminio-store", "crates/flaminio-disktool"]
exclude = ["fuzz"]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
rust-version = "1.85"
repository = "https://github.com/flaminio/flaminio"

[workspace.dependencies]
flaminio-format = { path = "crates/flaminio-format" }
flaminio-store = { path = "crates/flaminio-store" }
crc32c = "0.6.8"
thiserror = "2.0.12"
proptest = "1.6.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
