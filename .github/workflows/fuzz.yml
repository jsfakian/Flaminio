# Every fuzz target for 10 minutes, every Saturday (follow-ups §6, docs/ci.md, docs/4). The
# corpus carries over between runs on the runner host. Failing inputs are kept, as an artifact
# and on the runner host; a failed run is reported in an issue labelled fuzz.
name: Fuzz

on:
  schedule:
    - cron: "0 2 * * 6"
  workflow_dispatch:
    inputs:
      seconds:
        description: Seconds per target
        type: choice
        options: ["60", "300", "600"]
        default: "600"

permissions:
  contents: read

# One run at a time: they share the corpus on the runner host and the fuzz issue.
concurrency:
  group: fuzz
  cancel-in-progress: false

jobs:
  fuzz:
    name: Fuzz every target
    runs-on: [self-hosted, flaminio]
    # The builds, and up to 600 s for each target (the dispatch input is bounded to that): about
    # 60 minutes for five targets. Raise it with the number of targets.
    timeout-minutes: 120
    outputs:
      inputs: ${{ steps.kept.outputs.inputs }}
    env:
      CORPUS: ${{ github.workspace }}/dataplane/fuzz/corpus
      ARTIFACTS: ${{ github.workspace }}/dataplane/fuzz/artifacts
      SECONDS_PER_TARGET: ${{ inputs.seconds || '600' }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Restore the corpus
        run: |
          keep="$HOME/.cache/flaminio-ci/fuzz-corpus"
          mkdir -p "$keep" "$CORPUS"
          rsync -a "$keep/" "$CORPUS/"
      - run: FUZZ_SECONDS="$SECONDS_PER_TARGET" make fuzz
      - name: Keep the corpus
        if: always()
        run: rsync -a "$CORPUS/" "$HOME/.cache/flaminio-ci/fuzz-corpus/"
      # Also when the job is cancelled at its time limit: the inputs found so far count.
      - name: Keep the failing inputs
        id: kept
        if: failure() || cancelled()
        run: |
          if [[ -d $ARTIFACTS ]] && [[ -n $(find "$ARTIFACTS" -type f -print -quit) ]]; then
              keep="$HOME/.cache/flaminio-ci/fuzz-artifacts/$GITHUB_RUN_ID"
              mkdir -p "$keep"
              rsync -a "$ARTIFACTS/" "$keep/"
              echo "inputs=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Upload the failing inputs
        if: (failure() || cancelled()) && steps.kept.outputs.inputs == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-artifacts
          path: dataplane/fuzz/artifacts/
          retention-days: 90

  report:
    # When the fuzz job failed, or kept failing inputs before it was cancelled. Without always(),
    # GitHub would add success() to the condition, and this job would never run after a failure.
    name: Report the failed run
    needs: fuzz
    if: always() && (needs.fuzz.result == 'failure' || needs.fuzz.outputs.inputs == 'true')
    runs-on: [self-hosted, flaminio]
    timeout-minutes: 5
    permissions:
      issues: write
    env:
      # The workflow's token, not the administrator login gh has on the runner; and the
      # repository, which gh cannot read from a checkout this job does not have.
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      INPUTS: ${{ needs.fuzz.outputs.inputs }}
    steps:
      - name: Open or update the fuzz issue
        run: |
          gh label create fuzz --color B60205 --description "Failed runs of the Fuzz workflow" --force
          if [[ $INPUTS == true ]]; then
              note="The Fuzz run $RUN_URL kept failing inputs: the artifact fuzz-artifacts (90 days), and ~/.cache/flaminio-ci/fuzz-artifacts/$GITHUB_RUN_ID on the runner host. To fix them: docs/ci.md, Fuzzing."
          else
              note="The Fuzz run $RUN_URL failed before it kept any failing input (a build or toolchain failure?): the targets were not fuzzed. See its log."
          fi
          open=$(gh issue list --label fuzz --state open --limit 1 --json number --jq '.[0].number // empty')
          if [[ -n $open ]]; then
              gh issue comment "$open" --body "$note"
          else
              gh issue create --title "Fuzz run failed" --label fuzz --body "$note"
          fi
