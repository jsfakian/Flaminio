# Every fuzz target for 10 minutes, every Saturday (follow-ups §6, docs/ci.md, docs/4). The
# corpus carries over between runs on the runner host. Failing inputs are kept, as an artifact
# and on the runner host; a failed run is reported in an issue labelled fuzz.
name: Fuzz

on:
  schedule:
    - cron: "0 2 * * 6"
  workflow_dispatch:
    inputs:
      seconds:
        description: Seconds per target
        type: choice
        options: ["60", "300", "600"]
        default: "600"

permissions:
  contents: read

# One run at a time: they share the corpus on the runner host and the fuzz issue.
concurrency:
  group: fuzz
  cancel-in-progress: false

jobs:
  fuzz:
    name: Fuzz every target
    runs-on: [self-hosted, flaminio]
    # The builds, and up to 600 s for each target (the dispatch input is bounded to that): about
    # 60 minutes for five targets. Raise it with the number of targets.
    timeout-minutes: 120
    env:
      CORPUS: ${{ github.workspace }}/dataplane/fuzz/corpus
      ARTIFACTS: ${{ github.workspace }}/dataplane/fuzz/artifacts
      SECONDS_PER_TARGET: ${{ inputs.seconds || '600' }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Restore the corpus
        run: |
          keep="$HOME/.cache/flaminio-ci/fuzz-corpus"
          mkdir -p "$keep" "$CORPUS"
          rsync -a "$keep/" "$CORPUS/"
      - run: FUZZ_SECONDS="$SECONDS_PER_TARGET" make fuzz
      - name: Keep the corpus
        if: always()
        run: rsync -a "$CORPUS/" "$HOME/.cache/flaminio-ci/fuzz-corpus/"
      # Also when the job is cancelled at its time limit: the inputs found so far count.
      - name: Keep the failing inputs
        id: kept
        if: failure() || cancelled()
        run: |
          if [[ -d $ARTIFACTS ]] && [[ -n $(find "$ARTIFACTS" -type f -print -quit) ]]; then
              keep="$HOME/.cache/flaminio-ci/fuzz-artifacts/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
              mkdir -p "$keep"
              rsync -a "$ARTIFACTS/" "$keep/"
              echo "inputs=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Upload the failing inputs
        if: (failure() || cancelled()) && steps.kept.outputs.inputs == 'true'
        uses: actions/upload-artifact@v7
        with:
          # One per attempt: a re-run keeps the run, and a name may be used once in a run.
          name: fuzz-artifacts-${{ github.run_attempt }}
          path: dataplane/fuzz/artifacts/
          retention-days: 90

  report:
    # When the fuzz job failed or was cancelled (at its time limit, or by hand). Without always(),
    # GitHub would add success() to the condition, and this job would never run after a failure.
    name: Report the failed run
    needs: fuzz
    if: always() && (needs.fuzz.result == 'failure' || needs.fuzz.result == 'cancelled')
    # GitHub-hosted, not centaur: a run that failed because centaur hung must still be reported.
    # It only calls the API, for a minute, when a run failed.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
      # To see whether the fuzz job started, and whether it uploaded failing inputs: a cancelled
      # job's outputs are not reliable.
      actions: read
    env:
      # The workflow's token, and the repository, which gh cannot read from a checkout this job
      # does not have.
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Open or update the fuzz issue
        run: |
          attempt="repos/$GH_REPO/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT"
          # A run cancelled while still queued (by a newer one, through the concurrency group)
          # never fuzzed and did not fail: nothing to report.
          steps=$(gh api "$attempt/jobs" \
              --jq '[.jobs[] | select(.name == "Fuzz every target") | .steps | length] | add // 0')
          if [[ $steps -eq 0 ]]; then
              echo "The fuzz job never started: nothing to report."
              exit 0
          fi
          # This attempt's artifact only: the list holds every attempt's.
          kept=$(gh api "repos/$GH_REPO/actions/runs/$GITHUB_RUN_ID/artifacts" \
              --jq "[.artifacts[] | select(.name == \"fuzz-artifacts-$GITHUB_RUN_ATTEMPT\")] | length")
          if [[ $kept -gt 0 ]]; then
              note="The Fuzz run $RUN_URL (attempt $GITHUB_RUN_ATTEMPT) kept failing inputs: the artifact fuzz-artifacts-$GITHUB_RUN_ATTEMPT (90 days), and ~/.cache/flaminio-ci/fuzz-artifacts/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT on the runner host. To fix them: docs/ci.md, Fuzzing."
          else
              note="The Fuzz run $RUN_URL failed or was cancelled without keeping any failing input (a build or toolchain failure, or a hang?): the targets may not have been fuzzed. See its log."
          fi
          # Created only when missing, so its colour and description stay as maintainers set them.
          if ! gh label list --search fuzz --json name --jq '.[].name' | grep -qx fuzz; then
              gh label create fuzz --color B60205 --description "Failed runs of the Fuzz workflow"
          fi
          open=$(gh issue list --label fuzz --state open --limit 1 --json number --jq '.[0].number // empty')
          if [[ -n $open ]]; then
              gh issue comment "$open" --body "$note"
          else
              gh issue create --title "Fuzz run failed" --label fuzz --body "$note"
          fi
