# Weekly dependency updates, grouped per ecosystem; CI and `make hygiene` check each one.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /dataplane
    schedule:
      interval: weekly
    groups:
      cargo:
        patterns: ["*"]
  # The fuzz crate is a workspace of its own, with its own lockfile.
  - package-ecosystem: cargo
    directory: /dataplane/fuzz
    schedule:
      interval: weekly
    groups:
      fuzz:
        patterns: ["*"]
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      gomod:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
