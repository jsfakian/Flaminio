name: Set up
description: >-
  Go from go.mod, the Rust toolchains the runner host has (scripts/ci/runner-host.sh), and a
  Cargo target directory per runner, outside the workspace so builds carry over between runs.
runs:
  using: composite
  steps:
    - uses: actions/setup-go@v7
      with:
        go-version-file: go.mod
        # Self-hosted: the module and build caches persist in $HOME.
        cache: false
    - shell: bash
      run: |
        echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
        echo "CARGO_TARGET_DIR=$HOME/.cache/flaminio-ci/$RUNNER_NAME/target" >> "$GITHUB_ENV"
