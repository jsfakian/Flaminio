# Flaminio test lab: two servers with libvirt/KVM VMs: a data VM on each, and a small witness
# VM next to fl-a (phase 1). Every value can be overridden
# from the environment, e.g. `VM_A_CPUS=16 make vm-create`.

# Servers (names are ~/.ssh/config aliases).
: "${HOST_A:=rhythm}"
: "${HOST_A_IP:=147.52.71.227}"
# rhythm accepts SSH only from its own subnet. From elsewhere (off campus, no VPN), relay through
# a host inside it: HOST_A_JUMP=rhythm-backup make ...
: "${HOST_A_JUMP:=}"
: "${HOST_A_IFACE:=eno1}"          # rhythm's uplink, for the overlay port forwards
: "${HOST_B:=rhythm-backup}"
: "${HOST_B_IP:=147.52.71.226}"
: "${HOST_B_IFACE:=eno1}"          # rhythm-backup's uplink, for the replication port forward

# Guest OS: Ubuntu 26.04 ships kernel 7.0, the same as the hosts.
: "${UBUNTU_CODENAME:=resolute}"
: "${IMAGE_URL:=https://cloud-images.ubuntu.com/$UBUNTU_CODENAME/current/$UBUNTU_CODENAME-server-cloudimg-amd64.img}"
: "${VM_USER:=ubuntu}"
# Extra guest kernel arguments, applied by `make provision`. CET (shadow stacks, IBT) is turned
# off in the lab guests: on 2026-10-08 a vCPU of fl-a got stuck in a state where every user
# process on it died with a shadow-stack fault (see docs/lab.md, "Known issues"). This is a lab
# workaround for KVM/CET on these kernels, not a product decision. Set to "" to re-enable CET.
: "${GUEST_KERNEL_ARGS:=clearcpuid=user_shstk ibt=off}"
: "${SSH_PUBKEY_FILE:=$HOME/.ssh/id_rsa.pub}"

# VM a: the volume target (where fio runs). rhythm has 48 cores and 123 GiB.
: "${VM_A:=fl-a}"
: "${VM_A_HOST:=$HOST_A}"
: "${VM_A_CPUS:=8}"
: "${VM_A_MEM_GIB:=16}"
: "${VM_A_MAC:=52:54:00:f1:a0:0a}"
: "${VM_A_IP:=192.168.122.50}"
: "${VM_A_DATA_GIB:=${VM_DATA_GIB:-100}}"

# VM b: the remote replica. rhythm-backup has 12 cores and 30 GiB.
: "${VM_B:=fl-b}"
: "${VM_B_HOST:=$HOST_B}"
: "${VM_B_CPUS:=4}"
: "${VM_B_MEM_GIB:=8}"
: "${VM_B_MAC:=52:54:00:f1:a0:0b}"
: "${VM_B_IP:=192.168.122.51}"
: "${VM_B_DATA_GIB:=${VM_DATA_GIB:-100}}"

# VM w: a small witness. It holds no volume data; it is the third etcd member (and, later, the
# Kubernetes control plane), the 2-node + witness topology of ARCHITECTURE §1.2. It shares a
# server with fl-a, so it shows quorum behavior, not real failure independence.
: "${VM_W:=fl-w}"
: "${VM_W_HOST:=$HOST_A}"
: "${VM_W_CPUS:=2}"
: "${VM_W_MEM_GIB:=4}"
: "${VM_W_MAC:=52:54:00:f1:a0:0c}"
: "${VM_W_IP:=192.168.122.52}"
: "${VM_W_DATA_GIB:=8}"

# VM c: a third data node (phase 1 step 6), the destination of drains. It shares rhythm with fl-a
# and fl-w, so it adds capacity to move replicas to, not failure independence. Not an etcd member.
: "${VM_C:=fl-c}"
: "${VM_C_HOST:=$HOST_A}"
: "${VM_C_CPUS:=4}"
: "${VM_C_MEM_GIB:=8}"
: "${VM_C_MAC:=52:54:00:f1:a0:0d}"
: "${VM_C_IP:=192.168.122.53}"
: "${VM_C_DATA_GIB:=${VM_DATA_GIB:-100}}"

# libvirt resources (identical on both hosts).
: "${LIBVIRT_POOL:=default}"
: "${LIBVIRT_POOL_PATH:=/var/lib/libvirt/images}"
: "${LIBVIRT_NET:=default}"
: "${LIBVIRT_BRIDGE:=virbr0}"

# Disks (GiB). The data disk is Flaminio's raw device inside each VM.
: "${VM_ROOT_GIB:=40}"
: "${VM_DATA_GIB:=100}"

# Replication: VM a reaches VM b at HOST_B_IP:REPL_PORT, which HOST_B forwards to VM b. Only
# HOST_A's address may use the forward.
: "${REPL_PORT:=7410}"

# Overlay network (phase 1): a WireGuard mesh between the VMs, so that etcd, the metadata
# service and Kubernetes reach each other across the two NAT'ed libvirt networks, encrypted.
# Each VM listens on WG_PORT; its host forwards VM_x_WG_FWD (UDP) to it, from the other
# server's address only.
: "${WG_PORT:=51820}"
: "${VM_A_WG:=10.77.0.1}"
: "${VM_B_WG:=10.77.0.2}"
: "${VM_W_WG:=10.77.0.3}"
: "${VM_C_WG:=10.77.0.4}"
: "${VM_A_WG_FWD:=51821}"
: "${VM_B_WG_FWD:=51822}"
: "${VM_W_WG_FWD:=51823}"
: "${VM_C_WG_FWD:=51824}"

# Metadata service (phase 1): etcd on every VM of the cluster, flaminio-meta beside it.
: "${ETCD_VERSION:=3.7.2}"
: "${META_PORT:=7400}"

# Identities (phase 1 step 3): SPIFFE IDs in this trust domain, certificates valid this many
# days. The CAs and the token-signing key live in $LOCAL_STATE_DIR/pki (lab.sh pki init).
: "${TRUST_DOMAIN:=flaminio-lab}"
: "${CERT_DAYS:=30}"

# Phase-1 nodes (flaminio-io node): replication port on the overlay, and the test volume.
: "${NODE_PORT:=7411}"
: "${VOL:=vol1}"
: "${VOL_SIZE:=16G}"
: "${VOL_CHUNK:=256M}"

# Kubernetes (phase 1 step 7): k3s, server on the witness, agents on the data VMs, all over the
# overlay. `make k8s-tunnel` forwards this workstation's K8S_TUNNEL_PORT to the API server.
: "${K3S_VERSION:=v1.36.5+k3s1}"
: "${K8S_TUNNEL_PORT:=16443}"
# The benchmark pod's fio: built statically from this tag of github.com/axboe/fio.
: "${FIO_VERSION:=fio-3.41}"

# State: a directory in the home of each host, and .lab/ in the repository (gitignored).
: "${HOST_STATE_DIR:=flaminio-lab}"
: "${LOCAL_STATE_DIR:=$REPO_ROOT/.lab}"
