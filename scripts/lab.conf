# Flaminio test lab: two servers, one libvirt/KVM VM on each. Every value can be overridden
# from the environment, e.g. `VM_A_CPUS=16 make vm-create`.

# Servers (names are ~/.ssh/config aliases).
: "${HOST_A:=rhythm}"
: "${HOST_A_IP:=147.52.71.227}"
: "${HOST_B:=rhythm-backup}"
: "${HOST_B_IP:=147.52.71.226}"
: "${HOST_B_IFACE:=eno1}"          # rhythm-backup's uplink, for the replication port forward

# Guest OS: Ubuntu 26.04 ships kernel 7.0, the same as the hosts.
: "${UBUNTU_CODENAME:=resolute}"
: "${IMAGE_URL:=https://cloud-images.ubuntu.com/$UBUNTU_CODENAME/current/$UBUNTU_CODENAME-server-cloudimg-amd64.img}"
: "${VM_USER:=ubuntu}"
: "${SSH_PUBKEY_FILE:=$HOME/.ssh/id_rsa.pub}"

# VM a: the volume target (where fio runs). rhythm has 48 cores and 123 GiB.
: "${VM_A:=fl-a}"
: "${VM_A_HOST:=$HOST_A}"
: "${VM_A_CPUS:=8}"
: "${VM_A_MEM_GIB:=16}"
: "${VM_A_MAC:=52:54:00:f1:a0:0a}"
: "${VM_A_IP:=192.168.122.50}"

# VM b: the remote replica. rhythm-backup has 12 cores and 30 GiB.
: "${VM_B:=fl-b}"
: "${VM_B_HOST:=$HOST_B}"
: "${VM_B_CPUS:=4}"
: "${VM_B_MEM_GIB:=8}"
: "${VM_B_MAC:=52:54:00:f1:a0:0b}"
: "${VM_B_IP:=192.168.122.51}"

# libvirt resources (identical on both hosts).
: "${LIBVIRT_POOL:=default}"
: "${LIBVIRT_POOL_PATH:=/var/lib/libvirt/images}"
: "${LIBVIRT_NET:=default}"
: "${LIBVIRT_BRIDGE:=virbr0}"

# Disks (GiB). The data disk is Flaminio's raw device inside each VM.
: "${VM_ROOT_GIB:=40}"
: "${VM_DATA_GIB:=100}"

# Replication: VM a reaches VM b at HOST_B_IP:REPL_PORT, which HOST_B forwards to VM b. Only
# HOST_A's address may use the forward.
: "${REPL_PORT:=7410}"

# State: a directory in the home of each host, and .lab/ in the repository (gitignored).
: "${HOST_STATE_DIR:=flaminio-lab}"
: "${LOCAL_STATE_DIR:=$REPO_ROOT/.lab}"
