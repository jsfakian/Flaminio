# Code generation for the protobuf API: `make proto`. The plugins run through `go run` at
# pinned versions, so no protoc installation is needed.
version: v2
plugins:
  - local: ["go", "run", "google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.12"]
    out: api/gen/go
    opt: paths=source_relative
  - local: ["go", "run", "google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.2"]
    out: api/gen/go
    opt: paths=source_relative
